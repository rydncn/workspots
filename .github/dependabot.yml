# Weekly, grouped dependency updates (from the playbook's template). Major
# versions are left for a person to plan. New releases wait out a cooldown so
# a compromised version is usually caught and pulled before it reaches us.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match .npmrc's min-release-age, or Dependabot opens pull requests for
    # versions npm then refuses to install. Security updates skip the cooldown.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      e2e:
        update-types: [minor, patch]

  # The Dockerfile's base images, pinned by digest (ADR 0008). The Caddy image
  # the release rehearsal uses is pinned in ci.yml, which Dependabot does not
  # read: move it by hand with the Go base.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
