name: CI

# Adapted from the ai-playbook's templates/ci.yml for Go, Postgres and the npm
# in e2e/. Agents open pull requests as drafts: the quick checks run on every
# push; the test, end-to-end and release jobs wait until the pull request is
# ready for review. Branch protection requires every job by name (ADR 0010).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main are never
# cancelled, so a broken merge can't hide behind the next one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash with -o pipefail, so `cmd | tee log` fails when cmd does.
defaults:
  run:
    shell: bash

env:
  DEV_PG: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  checks:
    name: Format, vet and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "unformatted: $unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: go build
        run: go build ./...
      # Rule checks from CLAUDE.md that a grep can see. Each fails if it finds
      # nothing to scan, so a renamed folder can't make it pass on nothing.
      - name: HTTP stays in web
        run: |
          files=$(find internal -name '*.go' -not -path 'internal/web/*' | wc -l)
          test "$files" -gt 0 || { echo "no files scanned"; exit 1; }
          if grep -rl '"net/http"' internal --include='*.go' --exclude-dir=web; then
            echo "net/http imported outside internal/web"; exit 1
          fi
      - name: No unstructured logging or detached contexts
        run: |
          files=$(find internal -name '*.go' -not -name '*_test.go' | wc -l)
          test "$files" -gt 0 || { echo "no files scanned"; exit 1; }
          if grep -rnE 'fmt\.Print|log\.Print|context\.Background\(\)' internal --include='*.go' --exclude='*_test.go' --exclude-dir=testdb; then
            echo "use slog with the request context (.claude/rules/observability.md)"; exit 1
          fi

  tests:
    name: Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Create roles and databases
        run: psql "$DEV_PG" -v ON_ERROR_STOP=1 -f scripts/db-init.sql
      # Rule 2: every migration on an empty database, twice (the second run must
      # apply nothing). The privilege test then reads the catalogue.
      - name: Migrations on an empty database
        env:
          MIGRATE_DATABASE_URL: postgres://workspots_migrate:dev-migrate@localhost:5432/workspots_dev
        run: |
          go run ./cmd/workspots migrate | tee first.log
          grep -q '"migration applied"' first.log || { echo "no migration applied"; exit 1; }
          go run ./cmd/workspots migrate | tee second.log
          ! grep -q '"migration applied"' second.log || { echo "a migration applied twice"; exit 1; }
      - name: Tests
        run: go test -race -count=1 -shuffle=on ./... 2>&1 | tee test.log
      - name: Tests ran
        run: |
          grep -qE '^ok\s' test.log || { echo "no package reported ok"; exit 1; }
          ! grep -qE '^(FAIL|--- FAIL)' test.log || { echo "a test failed"; exit 1; }
          ! grep -q 'no test files' <(grep -E '^\?\s' test.log | grep -E 'internal/(web|migrate|config)') || { echo "a package has no tests"; exit 1; }

  e2e:
    name: End-to-end and accessibility
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Node 22 ships npm 10, which ignores min-release-age without a word;
      # the check below needs 11.10 or later.
      - name: Use npm 11
        run: npm install -g npm@11.21.2 # zizmor: ignore[adhoc-packages] exact version; npm itself cannot come from the lockfile it installs
      # Rule 7: prove the .npmrc hardening takes effect. An npm older than
      # 11.10 ignores min-release-age without a word.
      - name: npm supply-chain settings take effect
        working-directory: e2e
        run: |
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 10)) {
              console.error("npm " + process.argv[1] + " ignores min-release-age: use npm 11.10 or later.");
              process.exit(1);
            }' "$(npm --version)"
          test "$(npm config get ignore-scripts)" = "true" || { echo "ignore-scripts is not on"; exit 1; }
          test "$(npm config get min-release-age)" -ge 1 || { echo "min-release-age is not set"; exit 1; }
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Create roles and databases
        run: psql "$DEV_PG" -v ON_ERROR_STOP=1 -f scripts/db-init.sql
      - name: End-to-end and accessibility tests
        working-directory: e2e
        run: npm test 2>&1 | tee e2e.log
      # Rule 9: the run must have run tests, and not skipped them all.
      - name: Tests ran
        working-directory: e2e
        run: grep -qE '^\s+[1-9][0-9]* passed' e2e.log || { echo "no end-to-end test passed"; exit 1; }
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/.server.log
          if-no-files-found: ignore

  # The release rehearsal (docs/design.md): the production image, started in
  # production mode with generated database passwords behind Caddy's throwaway
  # certificate authority, so the app's own configuration is exactly what
  # production gets (AC27 is not weakened); migrations from the image, the
  # smoke subset of the end-to-end tests against it, then an image scan. Host
  # networking, so the containers reach the runner's Postgres and each other.
  release:
    name: Release rehearsal
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build -t workspots:rehearsal .
      - name: Migrate, then start the image behind Caddy
        run: |
          app_pw=$(openssl rand -hex 16); migrate_pw=$(openssl rand -hex 16)
          echo "::add-mask::$app_pw"; echo "::add-mask::$migrate_pw"
          psql "$DEV_PG" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE workspots_migrate LOGIN PASSWORD '$migrate_pw'" \
            -c "CREATE ROLE workspots_app LOGIN PASSWORD '$app_pw'" \
            -c "CREATE DATABASE workspots OWNER workspots_migrate"
          migrate_url="postgres://workspots_migrate:$migrate_pw@localhost:5432/workspots"
          docker run --rm --network host -e MIGRATE_DATABASE_URL="$migrate_url" workspots:rehearsal migrate
          docker run -d --name app --network host \
            -e WORKSPOTS_ENV=production -e ADDR=127.0.0.1:8080 -e BASE_URL=https://localhost:8443 \
            -e TRUSTED_PROXY=127.0.0.1 \
            -e DATABASE_URL="postgres://workspots_app:$app_pw@localhost:5432/workspots" \
            workspots:rehearsal
          docker run -d --name caddy --network host \
            caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee \
            caddy reverse-proxy --from https://localhost:8443 --to 127.0.0.1:8080 --disable-redirects
          for _ in $(seq 1 30); do curl -fsk https://localhost:8443/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsk https://localhost:8443/healthz | grep -qx ok || { echo "the image does not answer /healthz"; exit 1; }
          # Production mode is in force: HSTS is sent only there (AC24).
          curl -sk -D - -o /dev/null https://localhost:8443/ | grep -qi '^strict-transport-security:' || { echo "no HSTS: not production mode"; exit 1; }
          : psql "$migrate_url" -v ON_ERROR_STOP=1 -q -f e2e/seed.sql # PLANTED BREAK
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Use npm 11
        run: npm install -g npm@11.21.2 # zizmor: ignore[adhoc-packages] exact version; npm itself cannot come from the lockfile it installs
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Smoke tests against the image
        working-directory: e2e
        env:
          BASE_URL: https://localhost:8443
          E2E_IGNORE_HTTPS_ERRORS: "1" # the browser trusts Caddy's throwaway certificate for this run only
        run: npm run test:smoke 2>&1 | tee smoke.log
      - name: Tests ran
        working-directory: e2e
        run: grep -qE '^\s+[1-9][0-9]* passed' smoke.log || { echo "no smoke test passed"; exit 1; }
      - name: Container logs
        if: failure()
        run: docker logs app; docker logs caddy
      # GATES.md, Containers: the built image scanned, failing on high and
      # critical. An advisory nobody can fix yet goes in a .trivyignore with an
      # expiry (exp:YYYY-MM-DD), the same dated-allowlist rule as the audits.
      - name: Scan the image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: workspots:rehearsal
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # The shipped image is the rehearsed one, not a rebuild: its id is the
      # record. Hosting is out of scope, so nothing is pushed anywhere.
      - name: Record the image
        run: |
          {
            echo "### Release rehearsal"
            echo
            echo "Image built, migrated, smoke-tested and scanned: \`$(docker image inspect workspots:rehearsal --format '{{.Id}}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so secrets in earlier commits are found too
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Go's dependency audit: reports only vulnerable code the program calls.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
      # Node 22 ships npm 10, which ignores min-release-age without a word;
      # the check below needs 11.10 or later.
      - name: Use npm 11
        run: npm install -g npm@11.21.2 # zizmor: ignore[adhoc-packages] exact version; npm itself cannot come from the lockfile it installs
      # The e2e lockfile may only point at the npm registry, over HTTPS, with
      # each resolved URL matching its package name and a sha512 integrity hash.
      - name: e2e lockfile integrity
        working-directory: e2e
        run: >-
          npx --yes lockfile-lint@5.0.1 --path package-lock.json --type npm
          --allowed-hosts npm --validate-https --validate-package-names
          --validate-integrity
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: e2e registry signatures
        working-directory: e2e
        run: npm audit signatures
      - name: e2e dependency audit
        working-directory: e2e
        run: npm audit --audit-level=high

      # gitleaks from its release, checked against a pinned checksum. The same
      # command runs locally: gitleaks git --redact --verbose
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secrets scan
        run: gitleaks git --redact --verbose

      # zizmor lints the workflows: script injection, risky triggers, broad
      # permissions, credentials on disk, and pinned SHAs that aren't the
      # version their comment claims (online, with the job's token).
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$archive"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" zizmor
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Workflow security lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows

      # Agent configuration is code (rule 18): flag a pull request that touches
      # it for a human who reads what it runs and allows. Advisory; never fails.
      - name: Agent configuration changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='(^|/)(CLAUDE|AGENTS)\.md$|^\.claude/|^\.mcp\.json$|^\.github/workflows/|^\.devcontainer/'
          changed=$(git diff --name-only "$BASE_SHA" HEAD | grep -E "$pattern" || true)
          if [ -n "$changed" ]; then
            {
              echo "### Agent configuration changed: a human reviews it as code"
              echo
              echo "$changed" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$changed" | while read -r file; do
              echo "::warning file=$file::Agent configuration changed. Review what it runs and allows before merging (rule 18)."
            done
          fi
