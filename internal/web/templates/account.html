{{define "title"}}Your account: Workspots{{end}}
{{define "main"}}
<h1>Your account</h1>
{{if .Changed}}<p class="notice" role="status">Your password has been changed and your other sessions signed out.</p>{{end}}
<dl class="attrs-list">
  <div><dt>Email address</dt><dd>{{.Account.Email}}</dd></div>
  <div><dt>Role</dt><dd>{{.Account.Role}}</dd></div>
</dl>
<ul class="actions">
  <li><a href="/account/password">Change password</a></li>
  <li><form method="post" action="/sign-out"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit">Sign out</button></form></li>
</ul>
{{end}}
