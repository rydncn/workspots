<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}Workspots{{end}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <nav aria-label="Main">
    <a href="/" class="brand">Workspots</a>
    <ul class="nav-links">
    {{if .User}}
      <li><a href="/account">Account</a></li>
      <li><form method="post" action="/sign-out"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit" class="link">Sign out</button></form></li>
    {{else}}
      <li><a href="/sign-in">Sign in</a></li>
      <li><a href="/sign-up">Sign up</a></li>
    {{end}}
    </ul>
  </nav>
</header>
<main id="main" tabindex="-1">
{{block "main" .}}{{end}}
</main>
<footer><p>Good places to work remotely.</p></footer>
</body>
</html>
