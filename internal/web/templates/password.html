{{define "title"}}Change password: Workspots{{end}}
{{define "main"}}
<h1>Change password</h1>
{{template "errors" .}}
<form method="post" action="/account/password" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="field">
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" required autocomplete="current-password"{{range .Errors}}{{if eq .Field "current"}} aria-describedby="current-error" aria-invalid="true"{{end}}{{end}}>
    {{template "field_error" (dict . "current")}}
  </div>
  <div class="field">
    <label for="password">New password <span class="hint">(at least 12 characters)</span></label>
    <input id="password" name="password" type="password" required autocomplete="new-password" minlength="12"{{range .Errors}}{{if eq .Field "password"}} aria-describedby="password-error" aria-invalid="true"{{end}}{{end}}>
    {{template "field_error" (dict . "password")}}
  </div>
  <button type="submit">Change password</button>
</form>
<p><a href="/account">Back to your account</a></p>
{{end}}
