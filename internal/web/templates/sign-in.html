{{define "title"}}Sign in: Workspots{{end}}
{{define "main"}}
<h1>Sign in</h1>
{{template "errors" .}}
<form method="post" action="/sign-in" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="next" value="{{.Next}}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="{{.Email}}" required autocomplete="email" maxlength="254">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
  </div>
  <button type="submit">Sign in</button>
</form>
<p>New here? <a href="/sign-up">Sign up</a>.</p>
{{end}}
