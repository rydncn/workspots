{{define "title"}}Sign up: Workspots{{end}}
{{define "main"}}
<h1>Sign up</h1>
{{template "errors" .}}
<form method="post" action="/sign-up" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="{{.Email}}" required autocomplete="email" maxlength="254"{{range .Errors}}{{if eq .Field "email"}} aria-describedby="email-error" aria-invalid="true"{{end}}{{end}}>
    {{template "field_error" (dict . "email")}}
  </div>
  <div class="field">
    <label for="password">Password <span class="hint">(at least 12 characters)</span></label>
    <input id="password" name="password" type="password" required autocomplete="new-password" minlength="12"{{range .Errors}}{{if eq .Field "password"}} aria-describedby="password-error" aria-invalid="true"{{end}}{{end}}>
    {{template "field_error" (dict . "password")}}
  </div>
  <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="/sign-in">Sign in</a>.</p>
{{end}}
